name: SelloGo - pruebas de seguridad estática

on:
  push:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'propietario.html'
      - 'tarjeta.html'
      - 'cliente.html'
      - 'config.js'
      - 'tests/**'
      - '.github/workflows/seguridad-estatica.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'propietario.html'
      - 'tarjeta.html'
      - 'cliente.html'
      - 'config.js'
      - 'tests/**'
      - '.github/workflows/seguridad-estatica.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad-estatica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas sin acceso a Supabase
        run: node --test tests/seguridad-estatica.test.cjs tests/limites-qr-aislados.test.cjs tests/ip-validacion-propuesta.test.cjs tests/redes-compartidas-aisladas.test.cjs
