<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SelloGo · Empleados</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#35271d;background:#f8f3e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:white;max-width:440px;width:100%;padding:32px;border-radius:24px;box-shadow:0 12px 40px #503b2617}h1{margin:0;color:#8a612e}p{color:#75685c}label{display:block;margin:18px 0 6px;font-weight:600}input,button{width:100%;padding:13px;border-radius:12px;font:inherit}input{border:1px solid #d5c7b4}button{border:0;background:#9a713a;color:white;font-weight:700;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:24px}#panel{display:none}small{color:#75685c}
</style></head><body><main class="box"><h1>☕ SelloGo</h1><p>Acceso de empleados · Café Luna</p>
<form id="login"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit">Iniciar sesión</button></form>
<section id="panel"><h2>Panel de empleado</h2><p id="welcome"></p><small>Acceso autorizado. Próximamente: buscar tarjetas, registrar sellos y canjear recompensas.</small><button id="logout">Cerrar sesión</button></section>
<p id="status" role="status"></p></main><script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';
const status=document.querySelector('#status'), form=document.querySelector('#login'), panel=document.querySelector('#panel');
const btn=document.querySelector('#submit');
const valid=SUPABASE_URL.startsWith('https://') && SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_');
if(!valid){status.textContent='Configura la URL y Publishable Key en config.js antes de iniciar sesión';btn.disabled=true;}
else{
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
async function showSession(){
const {data:{user}}=await supabase.auth.getUser();
if(!user){form.style.display='block';panel.style.display='none';return;}
const {data,error}=await supabase.from('empleados').select('rol, negocio_id, negocios(nombre)').eq('usuario_id',user.id).limit(1);
if(error || !data?.length){await supabase.auth.signOut();form.style.display='block';panel.style.display='none';status.textContent='La cuenta existe, pero no está asignada como empleado. Revisa la tabla empleados.';return;}
form.style.display='none';panel.style.display='block';
document.querySelector('#welcome').textContent=`${user.email} · ${data[0].rol} · ${data[0].negocios?.nombre ?? 'Negocio'}`;
status.textContent='';
}
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;status.textContent='Verificando acceso…';try{
const {error}=await supabase.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});
if(error){status.textContent='No se pudo iniciar sesión. Comprueba correo y contraseña.';return;}
await showSession();
}finally{btn.disabled=false;}});
document.querySelector('#logout').addEventListener('click',async()=>{await supabase.auth.signOut();status.textContent='Sesión cerrada';showSession();});
await showSession();
}
</script></body></html>
